<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nature's Cafe - SmartPOS Pro</title>
  <meta name="theme-color" content="#121214" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #121214;
      --card-bg: #1c1c22;
      --surface: #26262e;
      --primary: #f59e0b;
      --blue: #2563eb;
      --green: #059669;
      --danger: #ef4444;
      --text: #f4f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding-bottom: 120px; overflow-x: hidden; }

    /* Top Navigation */
    .top-navbar { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 12px 18px; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border); }
    .brand-group { display: flex; align-items: center; gap: 10px; }
    .brand-icon-box { width: 34px; height: 34px; background: var(--primary); color: #000; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; }
    .brand-title-txt { font-size: 16px; font-weight: 800; color: #fff; letter-spacing: -0.3px; }
    .header-actions { display: flex; gap: 8px; }
    .btn-header { background: var(--surface); color: #e5e7eb; border: 1px solid rgba(255,255,255,0.12); padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .btn-header.kitchen-btn { background: #b45309; border-color: #f59e0b; color: #fff; }

    /* Store Header */
    .hero-store-bar { background: linear-gradient(180deg, #1f1b18 0%, #121214 100%); padding: 16px; text-align: center; border-bottom: 1px solid var(--border); }
    .store-banner-img { max-width: 100%; max-height: 85px; object-fit: cover; border-radius: 10px; margin-bottom: 8px; border: 1px solid var(--border); display: none; }
    .store-heading { font-size: 22px; font-weight: 800; color: #fff; }
    .store-subheading { font-size: 13px; color: var(--primary); font-weight: 600; margin-bottom: 4px; }
    .store-phone-tag { font-size: 12px; color: #d1d5db; font-weight: 600; margin-bottom: 8px; }
    .badge-today-sales { display: inline-flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.4); color: #6ee7b7; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; }

    /* Controls Container */
    .controls-container { max-width: 850px; margin: 12px auto; padding: 0 14px; }
    .search-input-field { width: 100%; padding: 12px 14px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 14px; outline: none; margin-bottom: 14px; }
    .search-input-field:focus { border-color: var(--primary); }

    /* Dual Tier Circular Avatars */
    .avatar-section-title { font-size: 12px; font-weight: 800; color: #d1d5db; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .avatar-scroll-track { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; margin-bottom: 12px; }
    .avatar-scroll-track::-webkit-scrollbar { display: none; }
    
    .cat-avatar-pill { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; flex-shrink: 0; }
    .cat-avatar-circle { width: 58px; height: 58px; border-radius: 50%; border: 2px solid #333; overflow: hidden; background: #26262e; display: flex; align-items: center; justify-content: center; transition: 0.2s; position: relative; }
    .cat-avatar-title { font-size: 11px; font-weight: 700; color: var(--muted); text-align: center; max-width: 65px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cat-avatar-pill.active .cat-avatar-circle { border-color: var(--primary); box-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }
    .cat-avatar-pill.active .cat-avatar-title { color: var(--primary); }

    .top-rank-badge { position: absolute; top: 0; right: 0; background: #ef4444; color: #fff; font-size: 9px; font-weight: 800; padding: 1px 4px; border-radius: 8px; border: 1px solid #000; }
    .top-qty-tag { font-size: 10px; font-weight: 700; color: #10b981; }

    /* Menu Cards */
    .menu-cards-wrap { display: flex; flex-direction: column; gap: 16px; max-width: 850px; margin: 0 auto; padding: 0 14px; }
    .menu-item-box { background: var(--card-bg); border-radius: 14px; overflow: hidden; border: 1px solid var(--border); }
    .item-media-top { position: relative; width: 100%; height: 160px; background: #202024; display: flex; align-items: center; justify-content: center; }
    .floating-badge { position: absolute; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
    .diet-badge { top: 10px; left: 10px; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
    .diet-badge.non-veg { color: var(--danger); }
    .diet-badge.veg { color: var(--green); }
    .tag-cat-badge { top: 10px; right: 10px; background: rgba(0,0,0,0.75); color: #e5e7eb; }
    .cost-overlay { position: absolute; bottom: 10px; left: 10px; font-size: 20px; font-weight: 800; color: var(--primary); text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .portion-overlay { position: absolute; bottom: 10px; right: 10px; font-size: 11px; color: #d1d5db; background: rgba(0,0,0,0.65); padding: 3px 8px; border-radius: 6px; }

    .item-info-bottom { padding: 14px; }
    .item-primary-txt { font-size: 17px; font-weight: 800; color: #fff; margin-bottom: 2px; }
    .item-secondary-txt { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 12px; }

    .size-selector-pills { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn-size-choice { flex: 1; padding: 10px 4px; background: transparent; border: 1px solid #333; color: #fff; font-size: 13px; font-weight: 700; border-radius: 8px; cursor: pointer; text-align: center; }
    .btn-size-choice.active { background: var(--primary); color: #000; border-color: var(--primary); }

    .btn-cart-push { width: 100%; background: var(--blue); color: #fff; border: none; padding: 12px; border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-cart-push:active { transform: scale(0.98); }

    /* Floating Cart Footer */
    .cart-checkout-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #16161a; border-top: 1px solid var(--border); padding: 12px 16px; display: none; align-items: center; justify-content: space-between; z-index: 1000; box-shadow: 0 -8px 24px rgba(0,0,0,0.6); }
    .cart-summary-block { display: flex; align-items: center; gap: 12px; }
    .cart-icon-sq { width: 44px; height: 44px; background: var(--primary); color: #000; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; position: relative; }
    .cart-badge-number { position: absolute; top: -5px; right: -5px; background: #000; color: #10b981; border: 1.5px solid #10b981; border-radius: 50%; font-size: 10px; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-weight: 800; }
    .cart-desc-text { display: flex; flex-direction: column; }
    .cart-units-text { font-size: 12px; color: #d1d5db; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .btn-empty-cart { color: #9ca3af; text-decoration: underline; cursor: pointer; font-size: 11px; }
    .cart-grand-amount { font-size: 18px; font-weight: 800; color: var(--primary); }

    .btn-open-checkout { background: var(--green); color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 10px; }

    /* Modals */
    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 16px; backdrop-filter: blur(4px); }
    .modal-sheet { background: #fff; color: #111; width: 100%; max-width: 450px; border-radius: 14px; padding: 18px; max-height: 90vh; overflow-y: auto; }
    .modal-title-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #e2e8f0; padding-bottom: 10px; margin-bottom: 12px; }
    .btn-modal-exit { background: #fee2e2; color: var(--danger); border: 2px solid var(--danger); width: 30px; height: 30px; border-radius: 50%; font-weight: 800; cursor: pointer; }

    .line-cart-item { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 8px 10px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
    .counter-btn { width: 26px; height: 26px; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: 700; cursor: pointer; background: #fff; }

    /* Order Type Selector */
    .order-type-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .order-type-btn { padding: 8px; border: 1.5px solid #cbd5e1; background: #f8fafc; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; text-align: center; }
    .order-type-btn.active { border-color: var(--primary); background: #fef3c7; color: #b45309; }

    /* Dynamic Table Selector (Table 1 to 20+) */
    .table-section-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
    .table-scroll-track { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 6px; scrollbar-width: thin; }
    .table-pill-btn { padding: 6px 12px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .table-pill-btn.active { background: #b45309; color: #fff; border-color: #b45309; }
    .custom-table-inp { width: 100%; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; font-weight: 700; outline: none; }

    /* Change Calculator */
    .change-calc-box { background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 8px; padding: 10px; margin: 10px 0; }
    .change-calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center; }
    .change-calc-grid input { padding: 8px; border: 1px solid #6ee7b7; border-radius: 6px; font-size: 14px; font-weight: 700; width: 100%; outline: none; }
    .change-display-val { font-size: 14px; font-weight: 800; color: #047857; text-align: right; }

    /* Split Allocation */
    .split-control-card { background: #f1f5f9; border-radius: 10px; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; }
    .split-title-bar { font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .split-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .split-input-box label { display: block; font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 3px; }
    .split-input-box input { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; font-weight: 700; outline: none; }

    /* Dynamic QR */
    .upi-qr-display { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; border: 1px dashed #94a3b8; border-radius: 10px; padding: 10px; margin: 8px 0; text-align: center; }
    #dynamicUpiQrImg { width: 130px; height: 130px; object-fit: contain; margin-bottom: 4px; display: none; }

    .modal-grid-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .btn-pay-cash { background: #059669; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; }
    .btn-pay-online { background: #2563eb; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; }
    .btn-pay-split { grid-column: span 2; background: #d97706; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 800; font-size: 13px; cursor: pointer; }
    .btn-action-print { grid-column: span 2; background: #0f172a; color: #fff; border: none; padding: 11px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-action-kot { grid-column: span 2; background: #475569; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }

    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 4px; }
    .input-field { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }

    .btn-download-backup { width: 100%; padding: 12px; background: #059669; color: #fff; border: none; border-radius: 8px; font-weight: 800; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }

    /* Kitchen Pending Cards */
    .kot-card { background: #fff; border-left: 5px solid #ef4444; border-radius: 8px; padding: 10px; margin-bottom: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

    /* THERMAL BILL CANVAS - FULL PAGE EXPANDED */
    #thermalBillArea, #kotBillArea {
      display: none;
      background: #fff;
      color: #000;
      width: 58mm;
      padding: 4mm 2mm;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.4;
    }
    .th-center { text-align: center; }
    .th-store { font-size: 19px; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
    .th-bill-title { font-size: 17px; font-weight: 800; text-transform: uppercase; margin: 6px 0; }
    .th-dash { border-top: 1.5px dashed #000; margin: 6px 0; }
    .th-row { display: flex; justify-content: space-between; margin: 4px 0; }
    .th-col-name { width: 50%; text-align: left; word-break: break-word; font-weight: 700; }
    .th-col-qty { width: 20%; text-align: right; }
    .th-col-tot { width: 30%; text-align: right; font-weight: 700; }
    .th-grand { font-size: 18px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
    
    @media print {
      @page { 
        size: 58mm auto; 
        margin: 0mm; 
      }
      
      html, body { 
        width: 58mm !important; 
        height: auto !important;
        margin: 0 !important; 
        padding: 0 !important; 
        background: #fff !important; 
        overflow: visible !important;
      }

      /* পুরো ওয়েবসাইটের বাড়তি সব অংশ প্রিন্ট থেকে বাদ দেওয়া */
      body > *:not(.printable-active) {
        display: none !important;
      }

      /* শুধু বিল বা KOT এরিয়া দৃশ্যমান রাখা */
      .printable-active { 
        display: block !important; 
        position: static !important; 
        width: 58mm !important; 
        margin: 0 !important; 
        padding: 2mm 2mm !important; 
      }
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <div class="top-navbar">
    <div class="brand-group">
      <div class="brand-icon-box"><i class="fa-solid fa-mug-hot"></i></div>
      <div class="brand-title-txt">Nature's Cafe</div>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-header kitchen-btn" onclick="openKitchenModal()">
        <i class="fa-solid fa-kitchen-set"></i> Kitchen (<span id="lblPendingCount">0</span>)
      </button>
      <button type="button" class="btn-header" onclick="openStoreSettings()"><i class="fa-solid fa-store"></i> Settings</button>
      <button type="button" class="btn-header" onclick="openLedgerReport()"><i class="fa-solid fa-book"></i> Ledger</button>
      <button type="button" class="btn-header" style="color:var(--primary);" onclick="openFoodManager()"><i class="fa-solid fa-plus"></i> Menu</button>
    </div>
  </div>

  <!-- Store Header -->
  <div class="hero-store-bar">
    <img id="storeBannerImg" class="store-banner-img" alt="Store Banner" />
    <div class="store-heading" id="lblStoreTitle">Nature's Cafe</div>
    <div class="store-subheading" id="lblStoreSubtitle">Coffee, Pizza, Burger & Snacks</div>
    <div class="store-phone-tag" id="lblStorePhone">Ph: Not configured</div>
    <div class="badge-today-sales">
      <i class="fa-solid fa-chart-line"></i> <span id="lblDailyMetrics">Today's Sales: Calculating...</span>
    </div>
  </div>

  <!-- Controls Container -->
  <div class="controls-container">
    <input type="text" id="txtMenuSearch" class="search-input-field" placeholder="Search menu items..." oninput="renderMenuCatalog()" />

    <!-- Tier 1: Today's Most to Lowest Selling Foods -->
    <div class="avatar-section-title">
      <i class="fa-solid fa-fire" style="color:#ef4444;"></i> Today's Sales Leaderboard
    </div>
    <div class="avatar-scroll-track" id="topSellingAvatarsTrack">
      <div style="font-size:11px; color:#6b7280; padding:10px;">No items sold today yet</div>
    </div>

    <!-- Tier 2: Menu Categories -->
    <div class="avatar-section-title" style="margin-top:6px;">
      <i class="fa-solid fa-layer-group" style="color:var(--primary);"></i> Menu Categories
    </div>
    <div class="avatar-scroll-track" id="categoryScrollList"></div>
  </div>

  <!-- Menu Cards -->
  <div class="menu-cards-wrap" id="menuCardsContainer"></div>

  <!-- Floating Cart Footer -->
  <div class="cart-checkout-bar" id="floatingCartContainer">
    <div class="cart-summary-block">
      <div class="cart-icon-sq">
        <i class="fa-solid fa-cart-shopping"></i>
        <div class="cart-badge-number" id="lblCartBadgeQty">0</div>
      </div>
      <div class="cart-desc-text">
        <div class="cart-units-text">
          <span id="lblCartCountText">0 Items Added</span>
          <span>•</span>
          <span class="btn-empty-cart" onclick="clearCartBasket()"><i class="fa-regular fa-trash-can"></i> Clear</span>
        </div>
        <div class="cart-grand-amount" id="lblCartSumTotal">Total: ₹0</div>
      </div>
    </div>
    <button type="button" class="btn-open-checkout" onclick="openCheckoutModal()">
      <i class="fa-solid fa-receipt"></i> Checkout & Pay <i class="fa-solid fa-arrow-right"></i>
    </button>
  </div>

  <!-- Checkout Modal -->
  <div class="modal-backdrop" id="checkoutModal">
    <div class="modal-sheet">
      <div class="modal-title-row">
        <h3 style="font-weight:800;"><i class="fa-solid fa-receipt"></i> Billing Checkout</h3>
        <button type="button" class="btn-modal-exit" onclick="closeModal('checkoutModal')">✕</button>
      </div>

      <!-- Dine-in / Parcel Selection -->
      <div class="order-type-tabs">
        <div class="order-type-btn active" id="btnTypeDineIn" onclick="setOrderType('DINE-IN')"><i class="fa-solid fa-utensils"></i> DINE-IN</div>
        <div class="order-type-btn" id="btnTypeParcel" onclick="setOrderType('PARCEL')"><i class="fa-solid fa-box-open"></i> PARCEL</div>
      </div>

      <!-- Dynamic Table Selector -->
      <div id="tableSelectorWrap" class="table-section-box">
